
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -q KidsWorldTV-Android-Starter.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Could not find settings.gradle.kts inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: KidsWorldTV-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
